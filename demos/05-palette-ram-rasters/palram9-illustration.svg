<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0a1a2e"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a020"/>
      <stop offset="30%" stop-color="#f0d060"/>
      <stop offset="50%" stop-color="#ffe880"/>
      <stop offset="70%" stop-color="#f0d060"/>
      <stop offset="100%" stop-color="#d4a020"/>
    </linearGradient>
    <linearGradient id="titleGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a07010"/>
      <stop offset="20%" stop-color="#d4a020"/>
      <stop offset="50%" stop-color="#ffe880"/>
      <stop offset="80%" stop-color="#d4a020"/>
      <stop offset="100%" stop-color="#a07010"/>
    </linearGradient>
    <linearGradient id="barDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a2a"/>
      <stop offset="100%" stop-color="#2a2a3a"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#d4a020"/>
      <stop offset="100%" stop-color="#ffe880"/>
    </linearGradient>
    <linearGradient id="barColorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6030"/>
      <stop offset="100%" stop-color="#cc3010"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <line x1="20" y1="0" x2="20" y2="20" stroke="#ffffff08" stroke-width="0.5"/>
      <line x1="0" y1="20" x2="20" y2="20" stroke="#ffffff08" stroke-width="0.5"/>
    </pattern>
    <pattern id="unusedHash" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#66666640" stroke-width="2"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d4a020"/>
    </marker>
  </defs>

  <rect width="1100" height="810" fill="url(#bgGrad)"/>
  <rect width="1100" height="810" fill="url(#grid)"/>

  <rect x="15" y="15" width="1070" height="780" rx="8" ry="8" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <rect x="22" y="22" width="1056" height="766" rx="6" ry="6" fill="none" stroke="#d4a02060" stroke-width="1"/>

  <rect x="130" y="30" width="840" height="42" rx="4" fill="#0a1a2e" stroke="url(#titleGold)" stroke-width="2"/>
  <text x="550" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#titleGold)" letter-spacing="3">PALRAM9: 3-ZONE TIMING (E0 BARS + E2-E7 IMAGE)</text>
  <line x1="150" y1="68" x2="950" y2="68" stroke="#d4a02040" stroke-width="1"/>

  <rect x="45" y="90" width="1010" height="95" rx="6" fill="#123051" stroke="url(#goldGrad)" stroke-width="2" opacity="0.96"/>
  <text x="62" y="116" font-size="15" fill="#ffffff" font-weight="bold">ZONE 1 (LINES 0-39): TOP RASTER BAR</text>
  <rect x="120" y="132" width="900" height="38" rx="4" fill="url(#barDark)" stroke="#444455" stroke-width="1.2"/>
  <line x1="380" y1="124" x2="380" y2="173" stroke="#ffffff70" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="380" y="120" text-anchor="middle" font-size="9" fill="#ffffff90">HBLANK ~72-80 cy</text>
  <rect x="134" y="136" width="42" height="30" rx="4" fill="#4CAF50" stroke="#2E7D32" stroke-width="1.3"/>
  <text x="155" y="156" text-anchor="middle" font-size="11" fill="white" font-weight="bold">OPEN</text>
  <rect x="182" y="136" width="42" height="30" rx="4" fill="url(#barColorGrad)" stroke="#ff4020" stroke-width="1.3"/>
  <text x="203" y="156" text-anchor="middle" font-size="11" fill="white" font-weight="bold">E0</text>
  <rect x="230" y="136" width="42" height="30" rx="4" fill="#d4a020" stroke="#b38600" stroke-width="1.3"/>
  <text x="251" y="156" text-anchor="middle" font-size="11" fill="white" font-weight="bold">CLOSE</text>
  <text x="288" y="155" font-size="11" fill="#ffcc80">Only entry E0 written each scanline; no palette flip in this zone</text>
  <line x1="820" y1="151" x2="1010" y2="151" stroke="url(#beamGrad)" stroke-width="3" marker-end="url(#arrowGold)"/>

  <rect x="45" y="205" width="1010" height="225" rx="6" fill="#0d1f35" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.96"/>
  <text x="62" y="232" font-size="15" fill="#ffffff" font-weight="bold">ZONE 2 (LINES 40-159): IMAGE CORE (FLIP-FIRST E2-E7)</text>
  <rect x="120" y="265" width="910" height="56" rx="5" fill="url(#barDark)" stroke="#444455" stroke-width="1.5"/>
  <line x1="376" y1="253" x2="376" y2="327" stroke="#ffffff60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="376" y="251" text-anchor="middle" font-size="9" fill="#ffffff80">HBLANK</text>

  <rect x="130" y="277" width="42" height="32" rx="4" fill="#e91e63" stroke="#c2185b" stroke-width="1.5"/>
  <text x="151" y="298" text-anchor="middle" font-size="12" fill="white" font-weight="bold">FLIP</text>
  <rect x="186" y="277" width="42" height="32" rx="4" fill="#4CAF50" stroke="#388E3C" stroke-width="1.5"/>
  <text x="207" y="295" text-anchor="middle" font-size="10" fill="white" font-weight="bold">OPEN</text>
  <text x="207" y="306" text-anchor="middle" font-size="8" fill="#c0ffc0">0x44</text>

  <rect x="242" y="272" width="346" height="42" rx="5" fill="none" stroke="#ffe880" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="415" y="269" text-anchor="middle" font-size="11" fill="#ffe880" font-weight="bold">REP OUTSB (CX=12)</text>

  <rect x="248" y="277" width="42" height="32" rx="3" fill="#e6a800" stroke="#b38600" stroke-width="1"/>
  <text x="269" y="298" text-anchor="middle" font-size="11" fill="white" font-weight="bold">E2</text>
  <rect x="294" y="277" width="42" height="32" rx="3" fill="#e05050" stroke="#b03030" stroke-width="1"/>
  <text x="315" y="298" text-anchor="middle" font-size="11" fill="white" font-weight="bold">E3</text>
  <rect x="340" y="277" width="42" height="32" rx="3" fill="#3080d0" stroke="#2060a0" stroke-width="1"/>
  <text x="361" y="298" text-anchor="middle" font-size="11" fill="white" font-weight="bold">E4</text>
  <rect x="386" y="277" width="42" height="32" rx="3" fill="#9040b0" stroke="#7030a0" stroke-width="1"/>
  <text x="407" y="298" text-anchor="middle" font-size="11" fill="white" font-weight="bold">E5</text>
  <rect x="432" y="277" width="42" height="32" rx="3" fill="#20a060" stroke="#108040" stroke-width="1"/>
  <text x="453" y="298" text-anchor="middle" font-size="11" fill="white" font-weight="bold">E6</text>
  <rect x="478" y="277" width="42" height="32" rx="3" fill="#d06820" stroke="#a05010" stroke-width="1"/>
  <text x="499" y="298" text-anchor="middle" font-size="11" fill="white" font-weight="bold">E7</text>

  <rect x="600" y="277" width="50" height="32" rx="4" fill="#d4a020" stroke="#b38600" stroke-width="1.5"/>
  <text x="625" y="298" text-anchor="middle" font-size="12" fill="white" font-weight="bold">CLOSE</text>
  <line x1="820" y1="293" x2="1010" y2="293" stroke="url(#beamGrad)" stroke-width="3" marker-end="url(#arrowGold)"/>

  <text x="130" y="347" font-size="12" fill="#e6a800" font-weight="bold">Current set:</text>
  <text x="240" y="347" font-size="11" fill="#aaaaaa">rewritten as passthrough</text>
  <text x="130" y="365" font-size="12" fill="#50ff80" font-weight="bold">Upcoming set:</text>
  <text x="255" y="365" font-size="11" fill="#aaaaaa">pre-loaded for next scanline flip</text>
  <text x="130" y="389" font-size="11" fill="#bbbbbb">E0 is not touched in Zone 2; background remains black from frame reset</text>
  <text x="130" y="407" font-size="11" fill="#888888">Cycle path in this zone: FLIP + OPEN(0x44) + REP OUTSBx12 + CLOSE</text>

  <rect x="45" y="450" width="1010" height="95" rx="6" fill="#123051" stroke="url(#goldGrad)" stroke-width="2" opacity="0.96"/>
  <text x="62" y="476" font-size="15" fill="#ffffff" font-weight="bold">ZONE 3 (LINES 160-199): BOTTOM RASTER BAR</text>
  <rect x="120" y="492" width="900" height="38" rx="4" fill="url(#barDark)" stroke="#444455" stroke-width="1.2"/>
  <line x1="380" y1="490" x2="380" y2="533" stroke="#ffffff70" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="380" y="489" text-anchor="middle" font-size="9" fill="#ffffff90">HBLANK ~72-80 cy</text>
  <rect x="134" y="496" width="42" height="30" rx="4" fill="#4CAF50" stroke="#2E7D32" stroke-width="1.3"/>
  <text x="155" y="516" text-anchor="middle" font-size="11" fill="white" font-weight="bold">OPEN</text>
  <rect x="182" y="496" width="42" height="30" rx="4" fill="url(#barColorGrad)" stroke="#ff4020" stroke-width="1.3"/>
  <text x="203" y="516" text-anchor="middle" font-size="11" fill="white" font-weight="bold">E0</text>
  <rect x="230" y="496" width="42" height="30" rx="4" fill="#d4a020" stroke="#b38600" stroke-width="1.3"/>
  <text x="251" y="516" text-anchor="middle" font-size="11" fill="white" font-weight="bold">CLOSE</text>
  <text x="288" y="515" font-size="11" fill="#9be7ff">Same E0-only timing as Zone 1; second bar animates via sine table</text>
  <line x1="820" y1="511" x2="1010" y2="511" stroke="url(#beamGrad)" stroke-width="3" marker-end="url(#arrowGold)"/>

  <rect x="45" y="565" width="1010" height="155" rx="6" fill="#0d1f35" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.95"/>
  <rect x="60" y="576" width="420" height="22" rx="3" fill="#d4a02015" stroke="#d4a02050" stroke-width="1"/>
  <text x="270" y="591" text-anchor="middle" font-size="13" fill="#d4a020" font-weight="bold" letter-spacing="1">Why PALRAM9 Uses Three Zones</text>

  <circle cx="80" cy="616" r="5" fill="#ff6030"/>
  <text x="95" y="620" font-size="12" fill="#ff6030" font-weight="bold">E0 in Bars:</text>
  <text x="165" y="620" font-size="11" fill="#aaaaaa">must finish in HBLANK (~55 cycles) to avoid full-width shimmer.</text>

  <circle cx="80" cy="636" r="5" fill="#e6a800"/>
  <text x="95" y="640" font-size="12" fill="#e6a800" font-weight="bold">E2-E7 in Image:</text>
  <text x="178" y="640" font-size="11" fill="#aaaaaa">12-byte stream may spill into visible area because it targets inactive palette.</text>

  <circle cx="80" cy="656" r="5" fill="#50ff80"/>
  <text x="95" y="660" font-size="12" fill="#50ff80" font-weight="bold">No Mixed Path:</text>
  <text x="180" y="660" font-size="11" fill="#aaaaaa">zone separation prevents timing drift and transition blinking.</text>

  <circle cx="80" cy="676" r="5" fill="#d4a020"/>
  <text x="95" y="680" font-size="12" fill="#d4a020" font-weight="bold">Trade-off:</text>
  <text x="155" y="680" font-size="11" fill="#aaaaaa">bars are confined to top/bottom 40 lines, but image zone stays stable.</text>

  <circle cx="80" cy="700" r="5" fill="#666666"/>
  <text x="95" y="704" font-size="12" fill="#666666" font-weight="bold">E1:</text>
  <text x="120" y="704" font-size="11" fill="#aaaaaa">unused in CGA mode 4. Not part of palram9 write path.</text>

  <text x="550" y="783" text-anchor="middle" font-size="11" fill="#d8d8d8" font-weight="600">
    Olivetti Prodest PC1 - Yamaha V6355D - NEC V40 @ 8 MHz - CGA Mode 4 - PALRAM9 three-zone timing model
  </text>
  <text x="1070" y="783" text-anchor="end" font-size="10" fill="#e8cb70" font-style="italic">Illustration by Retro Erik</text>
</svg>
