<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#18395b"/>
      <stop offset="100%" stop-color="#08182b"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <line x1="20" y1="0" x2="20" y2="20" stroke="#ffffff08" stroke-width="0.5"/>
      <line x1="0" y1="20" x2="20" y2="20" stroke="#ffffff08" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a87410"/>
      <stop offset="25%" stop-color="#d4a020"/>
      <stop offset="50%" stop-color="#ffe880"/>
      <stop offset="75%" stop-color="#d4a020"/>
      <stop offset="100%" stop-color="#a87410"/>
    </linearGradient>
    <linearGradient id="titleGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a5c0c"/>
      <stop offset="20%" stop-color="#d4a020"/>
      <stop offset="50%" stop-color="#fff0a0"/>
      <stop offset="80%" stop-color="#d4a020"/>
      <stop offset="100%" stop-color="#8a5c0c"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#d4a020"/>
      <stop offset="100%" stop-color="#fff0a0"/>
    </linearGradient>
    <linearGradient id="redBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7a52"/>
      <stop offset="100%" stop-color="#b51b06"/>
    </linearGradient>
    <linearGradient id="cyanBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ef8ff"/>
      <stop offset="100%" stop-color="#0e7f94"/>
    </linearGradient>
    <linearGradient id="screenGlowRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff000000"/>
      <stop offset="50%" stop-color="#ff5c2d"/>
      <stop offset="100%" stop-color="#ff000000"/>
    </linearGradient>
    <linearGradient id="screenGlowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff00"/>
      <stop offset="50%" stop-color="#5cf7ff"/>
      <stop offset="100%" stop-color="#00ffff00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000090"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowGold" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d4a020"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b42"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5cf7ff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <rect x="15" y="15" width="1570" height="870" rx="8" ry="8" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <rect x="22" y="22" width="1556" height="856" rx="6" ry="6" fill="none" stroke="#d4a02060" stroke-width="1"/>

  <circle cx="15" cy="15" r="6" fill="#d4a020" opacity="0.6"/>
  <circle cx="1585" cy="15" r="6" fill="#d4a020" opacity="0.6"/>
  <circle cx="15" cy="885" r="6" fill="#d4a020" opacity="0.6"/>
  <circle cx="1585" cy="885" r="6" fill="#d4a020" opacity="0.6"/>

  <rect x="115" y="30" width="1370" height="44" rx="4" fill="#0a1a2e" stroke="url(#titleGold)" stroke-width="2"/>
  <line x1="115" y1="30" x2="1485" y2="30" stroke="url(#titleGold)" stroke-width="2"/>
  <text x="800" y="59" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#titleGold)" filter="url(#glow)" font-variant="small-caps" letter-spacing="3">PALRAM7B: Dual Sine-Wave Raster Bars in Standard CGA Mode 4</text>
  <line x1="145" y1="70" x2="1455" y2="70" stroke="#d4a02040" stroke-width="1"/>

  <rect x="45" y="92" width="1510" height="118" rx="6" fill="#0d1f35" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.97"/>

  <rect x="65" y="108" width="300" height="86" rx="5" fill="#122640" stroke="#d4a02070" stroke-width="1.2"/>
  <text x="79" y="128" font-size="13" fill="#ffe880" font-weight="bold" letter-spacing="1">WHAT CHANGED?</text>
  <text x="79" y="149" font-size="12" fill="#d8d8d8">Only the video mode initialization.</text>
  <text x="79" y="170" font-size="12" fill="#a8d8ff">Hidden-mode demo:</text>
  <text x="79" y="187" font-size="12" fill="#ffffff" font-family="Consolas, 'Courier New', monospace">custom V6355D mode setup</text>

  <rect x="385" y="108" width="300" height="86" rx="5" fill="#122640" stroke="#4caf5070" stroke-width="1.2"/>
  <text x="399" y="128" font-size="13" fill="#8fffa0" font-weight="bold" letter-spacing="1">PALRAM7B PROOF</text>
  <text x="399" y="149" font-size="12" fill="#d8d8d8">Same palette RAM ports.</text>
  <text x="399" y="166" font-size="12" fill="#d8d8d8">Same OUTSB burst.</text>
  <text x="399" y="183" font-size="12" fill="#ffffff" font-family="Consolas, 'Courier New', monospace">mov ax, 0x0004  ; BIOS CGA mode 4</text>

  <line x1="725" y1="144" x2="760" y2="144" stroke="url(#beamGrad)" stroke-width="3" marker-end="url(#arrowGold)"/>
  <text x="738" y="179" text-anchor="middle" font-size="11" fill="#d4a020">same raster engine</text>

  <rect x="790" y="108" width="745" height="86" rx="5" fill="#122640" stroke="#d4a02070" stroke-width="1.2"/>
  <text x="806" y="128" font-size="13" fill="#ffe880" font-weight="bold" letter-spacing="1">CHIP FEATURE, NOT MODE FEATURE</text>
  <text x="806" y="149" font-size="12" fill="#d8d8d8">The V6355D palette RAM responds identically in CGA mode 4.</text>
  <text x="806" y="167" font-size="12" fill="#d8d8d8">All 512 RGB333 colors remain available because the palette RAM belongs to the chip, not the mode.</text>
  <text x="806" y="185" font-size="12" fill="#9fe9ff">palram7b proves the exact same per-scanline color-redefinition trick works on a black CGA screen.</text>

  <rect x="45" y="226" width="1510" height="286" rx="6" fill="#0d1f35" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.97"/>

  <text x="291" y="255" text-anchor="middle" font-size="15" fill="#cccccc" font-weight="bold" letter-spacing="2">HBLANK</text>
  <line x1="180" y1="261" x2="402" y2="261" stroke="#ffffff30" stroke-width="1"/>
  <text x="966" y="255" text-anchor="middle" font-size="15" fill="#cccccc" font-weight="bold" letter-spacing="2">VISIBLE AREA</text>
  <line x1="420" y1="261" x2="1512" y2="261" stroke="#ffffff30" stroke-width="1"/>

  <text x="63" y="314" font-size="18" fill="#ffffff" font-weight="bold">ONE</text>
  <text x="63" y="332" font-size="12" fill="#aaaaaa">SCANLINE</text>
  <text x="63" y="349" font-size="10" fill="#d4a020" font-style="italic">repeat 200x per frame</text>

  <rect x="180" y="288" width="1350" height="56" rx="6" fill="#1a2231" stroke="#4b5565" stroke-width="1.5"/>
  <line x1="407" y1="278" x2="407" y2="352" stroke="#ffffff60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="407" y="274" text-anchor="middle" font-size="9" fill="#ffffff90">~72 to 80 cycles</text>

  <rect x="192" y="299" width="62" height="34" rx="4" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="223" y="320" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">OPEN</text>
  <text x="223" y="331" text-anchor="middle" font-size="8" fill="#c0ffc0">0x40 - E0</text>
  <polygon points="260,316 266,312 266,320" fill="#d4a020"/>

  <rect x="270" y="299" width="66" height="34" rx="4" fill="url(#redBarGrad)" stroke="#ff5b32" stroke-width="1.5"/>
  <text x="303" y="319" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">OUTSB</text>
  <text x="303" y="330" text-anchor="middle" font-size="8" fill="#ffe0d0">R byte</text>
  <polygon points="342,316 348,312 348,320" fill="#d4a020"/>

  <rect x="352" y="299" width="48" height="34" rx="4" fill="url(#cyanBarGrad)" stroke="#4bdff2" stroke-width="1.5"/>
  <text x="376" y="319" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">OUTSB</text>
  <text x="376" y="330" text-anchor="middle" font-size="8" fill="#defcff">G|B</text>

  <rect x="422" y="299" width="72" height="34" rx="4" fill="#d4a020" stroke="#b38600" stroke-width="1.5"/>
  <text x="458" y="320" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">CLOSE</text>
  <text x="458" y="331" text-anchor="middle" font-size="8" fill="#fff2c0">0x80</text>

  <line x1="590" y1="316" x2="1510" y2="316" stroke="url(#beamGrad)" stroke-width="3" marker-end="url(#arrowGold)"/>
  <line x1="1474" y1="307" x2="1517" y2="307" stroke="#d4a02060" stroke-width="1"/>
  <line x1="1480" y1="312" x2="1522" y2="312" stroke="#d4a02040" stroke-width="1"/>
  <line x1="1474" y1="321" x2="1517" y2="321" stroke="#d4a02060" stroke-width="1"/>
  <line x1="1480" y1="326" x2="1522" y2="326" stroke="#d4a02040" stroke-width="1"/>

  <text x="600" y="300" font-size="12" fill="#ffe880" font-weight="bold">Beam sweeps left to right after HBLANK.</text>
  <text x="600" y="332" font-size="12" fill="#d8d8d8">The newly redefined E0 color becomes the background shade for this scanline.</text>

  <line x1="223" y1="351" x2="223" y2="380" stroke="#5cf7ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="303" y1="351" x2="303" y2="380" stroke="#ff6b42" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="376" y1="351" x2="376" y2="380" stroke="#5cf7ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="458" y1="351" x2="458" y2="380" stroke="#d4a020" stroke-width="2" marker-end="url(#arrowGold)"/>

  <text x="223" y="397" text-anchor="middle" font-size="10" fill="#8fffa0" font-weight="bold">OPEN E0</text>
  <text x="303" y="397" text-anchor="middle" font-size="10" fill="#ff8d6a" font-weight="bold">E0 R</text>
  <text x="376" y="397" text-anchor="middle" font-size="10" fill="#9fe9ff" font-weight="bold">E0 G|B</text>
  <text x="458" y="397" text-anchor="middle" font-size="10" fill="#ffe880" font-weight="bold">CLOSE E0</text>
  <text x="180" y="413" font-size="11" fill="#b8c9dd">E0 update sequence inside HBLANK: open at 0x40, write R then G|B, then close at 0x80.</text>

  <rect x="118" y="425" width="912" height="67" rx="5" fill="#101725" stroke="#2a3547" stroke-width="1"/>
  <text x="140" y="447" font-size="13" fill="#ff6b42" font-weight="bold">E0 is the whole trick.</text>
  <text x="266" y="447" font-size="12" fill="#d8d8d8">In palram7b there is no BMP stream, no E2-E7 update, and no palette flip.</text>
  <text x="140" y="468" font-size="12" fill="#d8d8d8">That is why the write fits cleanly inside HBLANK: open E0, send two RGB bytes, close. If the next scanline needs the same color, the code skips the port writes entirely.</text>
  <text x="140" y="487" font-size="12" fill="#9fe9ff">Result: minimal jitter, stable bars, and a direct proof that standard CGA mode 4 still exposes the V6355D palette RAM.</text>

  <rect x="45" y="528" width="1510" height="248" rx="6" fill="#0d1f35" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.97"/>

  <rect x="72" y="555" width="642" height="190" rx="8" fill="#020406" stroke="#4d5969" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="92" y="577" font-size="13" fill="#d8d8d8" font-weight="bold" letter-spacing="1">BLACK CGA SCREEN, COLOR 0 REDEFINED EVERY SCANLINE</text>

  <rect x="88" y="615" width="610" height="6" fill="#1a0000" opacity="0.18"/>
  <rect x="88" y="621" width="610" height="6" fill="#3b0800" opacity="0.25"/>
  <rect x="88" y="627" width="610" height="6" fill="#742000" opacity="0.45"/>
  <rect x="88" y="633" width="610" height="6" fill="#b83408" opacity="0.76"/>
  <rect x="88" y="639" width="610" height="6" fill="#ff5a24" opacity="0.95"/>
  <rect x="88" y="645" width="610" height="6" fill="#ff845f" opacity="0.9"/>
  <rect x="88" y="651" width="610" height="6" fill="#ff5a24" opacity="0.95"/>
  <rect x="88" y="657" width="610" height="6" fill="#b83408" opacity="0.76"/>
  <rect x="88" y="663" width="610" height="6" fill="#742000" opacity="0.45"/>
  <rect x="88" y="669" width="610" height="6" fill="#3b0800" opacity="0.25"/>
  <rect x="88" y="675" width="610" height="6" fill="#1a0000" opacity="0.18"/>
  <rect x="88" y="681" width="610" height="6" fill="#000000" opacity="1"/>

  <rect x="88" y="646" width="610" height="6" fill="url(#screenGlowRed)" opacity="0.55"/>

  <rect x="88" y="677" width="610" height="6" fill="#001112" opacity="0.2"/>
  <rect x="88" y="683" width="610" height="6" fill="#00262b" opacity="0.28"/>
  <rect x="88" y="689" width="610" height="6" fill="#004c59" opacity="0.46"/>
  <rect x="88" y="695" width="610" height="6" fill="#087994" opacity="0.72"/>
  <rect x="88" y="701" width="610" height="6" fill="#17b5cf" opacity="0.92"/>
  <rect x="88" y="707" width="610" height="6" fill="#7bf0ff" opacity="0.9"/>
  <rect x="88" y="713" width="610" height="6" fill="#17b5cf" opacity="0.92"/>
  <rect x="88" y="719" width="610" height="6" fill="#087994" opacity="0.72"/>
  <rect x="88" y="725" width="610" height="6" fill="#004c59" opacity="0.46"/>
  <rect x="88" y="731" width="610" height="6" fill="#00262b" opacity="0.28"/>
  <rect x="88" y="737" width="610" height="6" fill="#001112" opacity="0.2"/>

  <rect x="88" y="705" width="610" height="6" fill="url(#screenGlowCyan)" opacity="0.58"/>

  <path d="M130 642 C220 590, 320 580, 420 636 S620 705, 680 701" fill="none" stroke="#ff8f68" stroke-width="2" stroke-dasharray="5,4" opacity="0.55"/>
  <path d="M128 705 C240 742, 352 745, 458 700 S610 626, 686 637" fill="none" stroke="#86f7ff" stroke-width="2" stroke-dasharray="5,4" opacity="0.55"/>

  <text x="104" y="610" font-size="11" fill="#ffb29a">Red bar: R ramps 1 - 7 - 1 while G and B stay 0.</text>
  <text x="104" y="692" font-size="11" fill="#9fe9ff">Cyan bar: R stays 0 while G and B ramp together.</text>

  <line x1="734" y1="610" x2="1530" y2="610" stroke="#ffffff24" stroke-width="1"/>
  <text x="891" y="577" text-anchor="middle" font-size="13" fill="#ffe880" font-weight="bold" letter-spacing="1">WHAT THE AUDIENCE SHOULD SEE</text>

  <circle cx="766" cy="628" r="5" fill="#ff6b42"/>
  <text x="780" y="632" font-size="12" fill="#d8d8d8">Two independent sine-wave bars bounce on a black CGA mode 4 screen.</text>

  <circle cx="766" cy="654" r="5" fill="#5cf7ff"/>
  <text x="780" y="658" font-size="12" fill="#d8d8d8">Each scanline gets its own temporary background shade because E0 is rewritten during HBLANK.</text>

  <circle cx="766" cy="680" r="5" fill="#d4a020"/>
  <text x="780" y="684" font-size="12" fill="#d8d8d8">The visible beam never sees the writes happening; it only sees the new value once the line begins.</text>

  <circle cx="766" cy="706" r="5" fill="#8fffa0"/>
  <text x="780" y="710" font-size="12" fill="#d8d8d8">Because the background is color 0, redefining E0 recolors the whole bar scanline at once.</text>

  <circle cx="766" cy="732" r="5" fill="#9d9d9d"/>
  <text x="780" y="736" font-size="12" fill="#d8d8d8">The skip-if-same optimization avoids writes on unchanged lines, keeping timing tight and artifacts low.</text>

  <line x1="697" y1="642" x2="748" y2="628" stroke="#ff6b42" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <line x1="697" y1="707" x2="748" y2="654" stroke="#5cf7ff" stroke-width="1.8" marker-end="url(#arrowCyan)"/>

  <rect x="45" y="792" width="1510" height="34" rx="5" fill="#0d1f35" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.97"/>
  <text x="70" y="814" font-size="12" fill="#ffe880" font-weight="bold">KEY POINT:</text>
  <text x="145" y="814" font-size="12" fill="#d8d8d8">palram7b uses standard BIOS CGA mode 4, then performs the same palette RAM HBLANK writes as the hidden-mode demos. That proves the effect comes from the V6355D chip itself.</text>

  <text x="800" y="862" text-anchor="middle" font-size="11" fill="#d8d8d8" font-weight="600">Olivetti Prodest PC1 - Yamaha V6355D - NEC V40 @ 8 MHz - Standard CGA Mode 4 - E0-only palette RAM raster bars confirmed on real hardware (March 2026)</text>
  <text x="1570" y="862" text-anchor="end" font-size="10" fill="#e8cb70" font-style="italic">Illustration by Retro Erik</text>
</svg>